pan class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-1)\"><\u002Fspan>قرارات مملوكة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-2)\"><\u002Fspan>قرارات مُصعَّدة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-3)\"><\u002Fspan>قرارات معلّقة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-4)\"><\u002Fspan>غير مُسنَدة<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">السلسلة التصنيفية تتبادل الأزرق والرمادي، ومعها نص دائمًا. لون واحد لا يحمل معنى بلا كلمة.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">Measured contrast (WCAG 2.x, sRGB, on white)<\u002Fp>\n      <table class=\"lg-table ds-results\">\n        <tbody>\n          <tr><th scope=\"row\">ink n-950 on bg<\u002Fth><td class=\"lg-table__num\">20.13<\u002Ftd><td>Body, all tashkil<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">ink-secondary n-700<\u002Fth><td class=\"lg-table__num\">11.19<\u002Ftd><td>Secondary prose<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">ink-muted n-600<\u002Fth><td class=\"lg-table__num\">7.11<\u002Ftd><td>Captions, hints<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">link b-600 on bg<\u002Fth><td class=\"lg-table__num\">7.78<\u002Ftd><td>Links, body accent<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">white on accent b-500<\u002Fth><td class=\"lg-table__num\">5.32<\u002Ftd><td>Primary button<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">white on critical<\u002Fth><td class=\"lg-table__num\">7.57<\u002Ftd><td>UI failure only<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">ink-disabled n-500<\u002Fth><td class=\"lg-table__num\">4.18<\u002Ftd><td>Disabled only (exempt)<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">bg vs surface n-50<\u002Fth><td class=\"lg-table__num\">1.10<\u002Ftd><td>Two surfaces — never a text pair<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lg-figure__caption\">Adjacent surfaces are separated by a rule, not by contrast.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3 · AMBER -->\n<section class=\"ds-sec\" id=\"amber\">\n  <p class=\"ds-sec__no\">03<\u002Fp>\n  <h2 class=\"ds-sec__title\">الكهرمان — لون توكيد، لا لون حالة<\u002Fh2>\n  <p class=\"ds-sec__note\">دخل النظام من مكان واحد: النقطة داخل العلامة. <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">#FBB400<\u002Fspan> يقول «هذا هو» — عنصرٌ واحد في كل مساحة عرض، لا أكثر. ليس تحذيرًا، ولا الدرجة الوسطى في مقياس أحمر-أصفر-أخضر، ولا لون علامة تجارية ثانية. تغطيته تحت 1%، والأبيض لا يوضع عليه أبدًا: النسبة 1.81 وهي فشل صريح.<\u002Fp>\n\n  <h3 class=\"ds-sub\">السلّم<\u002Fh3>\n  <div class=\"ds-swatches\">\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-50)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-50<\u002Fb><span dir=\"ltr\" lang=\"en\">#FFF7E3 · tint<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-100)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-100<\u002Fb><span dir=\"ltr\" lang=\"en\">#FFECBF · highlight<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-200)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-200<\u002Fb><span dir=\"ltr\" lang=\"en\">#FFDC8A<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-300)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-300<\u002Fb><span dir=\"ltr\" lang=\"en\">#FFC94D · border<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-400)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-400<\u002Fb><span dir=\"ltr\" lang=\"en\">#FBB400 · amber · ink 11.09<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-500)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-500<\u002Fb><span dir=\"ltr\" lang=\"en\">#DE9E00 · hover<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-600)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-600<\u002Fb><span dir=\"ltr\" lang=\"en\">#B67F00 · press<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-700)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-700<\u002Fb><span dir=\"ltr\" lang=\"en\">#8C6000 · ink 5.54<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-800)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-800<\u002Fb><span dir=\"ltr\" lang=\"en\">#684700 · 8.43<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-a-900)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>a-900<\u002Fb><span dir=\"ltr\" lang=\"en\">#432E00<\u002Fspan><\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"lg-figure__caption\" style=\"margin-block-start:var(--lg-space-4)\"><b>a-400<\u002Fb> هو الدرجة الوحيدة المسموح بها كتعبئة، و<b>a-700<\u002Fb> هي الوحيدة المسموح بها على نص بحجم المتن. ما بينهما درجات تفاعل (تمرير وضغط) وحدود وأرضيات، لا أكثر.<\u002Fp>\n\n  <h3 class=\"ds-sub\">الاستخدامات المسموحة، وهي كلها<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\"><span dir=\"ltr\">01<\u002Fspan> · العنصر المُشار إليه في قائمة أو تذييل<\u002Fp>\n      <div class=\"ds-case\">\n        <p style=\"display:flex;align-items:center;gap:var(--lg-space-2);margin:0\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan><b>حدود الصلاحيات المعتمدة<\u002Fb><\u002Fp>\n        <p class=\"ds-case__label\">النقطة تعني: هذا موضعك الآن. هي التي تعلّم القسم الجاري في الشريط الجانبي على يسار هذه الصفحة.<\u002Fp>\n      <\u002Fdiv>\n\n      <p class=\"ds-tag\"><span dir=\"ltr\">02<\u002Fspan> · الصفّ الذي يجيب على السؤال<\u002Fp>\n      <table class=\"lg-table\">\n        <thead><tr><th scope=\"col\">القرار<\u002Fth><th scope=\"col\">الحد<\u002Fth><th scope=\"col\">المالك<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><th scope=\"row\">شراء تشغيلي<\u002Fth><td class=\"lg-table__num\">≤ 500,000<\u002Ftd><td>مدير الوحدة<\u002Ftd><\u002Ftr>\n          <tr class=\"lg-table__row--marked\"><th scope=\"row\">توظيف قيادي<\u002Fth><td class=\"lg-table__num\">—<\u002Ftd><td>غائب<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">إعادة هيكلة<\u002Fth><td class=\"lg-table__num\">≤ 5,000,000<\u002Ftd><td>الرئيس التنفيذي<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lg-figure__caption\">مسطرة كهرمانية وأرضية <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">a-50<\u002Fspan> على صفٍّ واحد. صفّان مُعلَّمان يعنيان أن لا شيء مُعلَّم.<\u002Fp>\n\n      <p class=\"ds-tag\"><span dir=\"ltr\">03<\u002Fspan> · التوكيد داخل جملة<\u002Fp>\n      <div class=\"ds-case\">\n        <p style=\"margin:0\">من أصل <span class=\"lg-figure__number\">12<\u002Fspan> قرارًا في المختبر، <mark>قرار واحد بلا مالك<\u002Fmark> — وهو الذي عطّل الاثني عشر.<\u002Fp>\n        <p class=\"ds-case__label\">التوكيد على أقصر عبارة تحمل المعنى، ومرة واحدة في الصفحة. لا يوضع على سطر يحمل تشكيلًا.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\"><span dir=\"ltr\">04<\u002Fspan> · كتلة التوكيد<\u002Fp>\n      <div class=\"lg-callout lg-callout--emphasis\">\n        <p class=\"lg-callout__title\">القرار الغائب<\u002Fp>\n        <p class=\"lg-callout__body\">لا أحد يملك توظيف القيادات. ليس تأخيرًا في المسار، بل قرار غير موجود في الهيكل — والمخرَج تعريفه وإسناده وحدّه.<\u002Fp>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">كتلة واحدة كهرمانية في المستند. البقية بالأزرق الفاتح أو الرمادي.<\u002Fp>\n\n      <p class=\"ds-tag\"><span dir=\"ltr\">05<\u002Fspan> · المفتاح الخامس في سلسلة تصنيفية<\u002Fp>\n      <div class=\"lg-cat\">\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-1)\"><\u002Fspan>مملوكة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-2)\"><\u002Fspan>مُصعَّدة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-3)\"><\u002Fspan>معلّقة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-4)\"><\u002Fspan>غير مُسنَدة<\u002Fspan>\n        <span class=\"lg-cat__item\"><span class=\"lg-cat__key\" style=\"background:var(--lg-cat-5)\"><\u002Fspan>المحور<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">الكهرمان فئة واحدة فقط: الفئة التي تحمل الحكم. ولا يدخل السلسلة المتصلة <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">b-200 → b-800<\u002Fspan> أبدًا — درجة واحدة تعني درجة واحدة.<\u002Fp>\n\n      <p class=\"ds-tag\" dir=\"ltr\" lang=\"en\">Measured contrast (WCAG 2.x, sRGB)<\u002Fp>\n      <table class=\"lg-table ds-results\" dir=\"ltr\" lang=\"en\">\n        <tbody>\n          <tr><th scope=\"row\">ink n-950 on amber a-400<\u002Fth><td class=\"lg-table__num\">11.09<\u002Ftd><td class=\"ds-pass\">Only text pair on amber<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">white on amber a-400<\u002Fth><td class=\"lg-table__num\">1.81<\u002Ftd><td>Forbidden<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">amber-ink a-700 on bg<\u002Fth><td class=\"lg-table__num\">5.54<\u002Ftd><td class=\"ds-pass\">Body-size amber text<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">amber-ink a-700 on tint a-50<\u002Fth><td class=\"lg-table__num\">5.19<\u002Ftd><td class=\"ds-pass\">Emphasis callout<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">ink on tint a-50<\u002Fth><td class=\"lg-table__num\">18.75<\u002Ftd><td class=\"ds-pass\">Callout body<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">ink on highlight a-100<\u002Fth><td class=\"lg-table__num\">17.17<\u002Ftd><td class=\"ds-pass\">&lt;mark&gt;<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">amber a-400 vs accent b-500<\u002Fth><td class=\"lg-table__num\">2.93<\u002Ftd><td>Adjacent fills, never a text pair<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">المحظورات<\u002Fh3>\n  <div class=\"ds-rules\">\n    <ul>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">أبيض على كهرمان، في زر أو وسم أو رأس جدول — 1.81.<\u002Fspan><\u002Fli>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">كهرمان لحالة: لا تحذير، ولا «قيد المراجعة»، ولا الدرجة الوسطى بين أحمر وأخضر. فشل الواجهة وحده له لون، وهو <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">#A32013<\u002Fspan>.<\u002Fspan><\u002Fli>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">زر أساسي كهرماني. الزر الأساسي أزرق، والكهرمان لا يُنقر.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <ul>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">تدرّج بين الأزرق والكهرمان، ولا خلطهما في مسطرة أو حد واحد.<\u002Fspan><\u002Fli>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">تشكيل على أرضية كهرمانية: السطر الذي يحمل تشكيلًا حبرٌ على أبيض دائمًا.<\u002Fspan><\u002Fli>\n      <li><b>لا<\u002Fb><span class=\"ds-dont\">مساحة كهرمانية كبيرة: لا شريط قسم، ولا خلفية بطاقة، ولا تذييل. الحد 1% من مساحة العرض.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4 · TYPE -->\n<section class=\"ds-sec\" id=\"type\">\n  <p class=\"ds-sec__no\">04<\u002Fp>\n  <h2 class=\"ds-sec__title\">الطباعة — المرعي والإنسترمنت سانس<\u002Fh2>\n  <p class=\"ds-sec__note\">خطان بترخيص مفتوح، مستضافان محليًا، مضبوطان على الحجم البصري نفسه: ارتفاع السين 514 مقابل ارتفاع الحرف الصغير 510، وارتفاع الألف 716 مقابل الحرف الكبير 720 لكل 1000 وحدة. النسبة 1.2، وارتفاع السطر العربي 1.9 مقابل 1.6 لاتيني. لا تباعد حروف في العربية، ولا مائل، ولا حروف كبيرة مصطنعة.<\u002Fp>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">عربي · RTL · Almarai · line-height 1.9<\u002Fp>\n      <div class=\"ds-scale\">\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">display 47.8/800<\u002Fspan><span style=\"font-size:var(--lg-text-display);font-weight:var(--lg-w-display);line-height:var(--lg-lh-ar-display)\">مَن يقرر<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">3xl 39.8/700<\u002Fspan><span style=\"font-size:var(--lg-text-3xl);font-weight:var(--lg-w-strong);line-height:var(--lg-lh-ar-display)\">حدود الصلاحيات<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">2xl 33.2/700<\u002Fspan><span style=\"font-size:var(--lg-text-2xl);font-weight:var(--lg-w-strong);line-height:var(--lg-lh-ar-display)\">البنية والتصميم المؤسسي<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">xl 27.6/700<\u002Fspan><span style=\"font-size:var(--lg-text-xl);font-weight:var(--lg-w-strong)\">نموذج التشغيل الذكي<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">md 19.2/400<\u002Fspan><span style=\"font-size:var(--lg-text-md)\">ماذا يبقى بعد أن يقرر<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">base 16/400<\u002Fspan><span style=\"font-size:var(--lg-text-base)\">نحدد مَن يقرر، وعند أي حد، وماذا يبقى<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">sm 13.3/400<\u002Fspan><span style=\"font-size:var(--lg-text-sm)\">الشكل 1 · خريطة حدود الصلاحيات<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"max-inline-size:var(--lg-measure-ar);color:var(--lg-ink-secondary)\">المتن العربي 16px وارتفاع سطر 1.9: مساحة كافية لعلامات التشكيل فوق السطر ولنزول الجيم تحته. الأرقام الغربية 0–9 داخل النص العربي: 500,000 ريال، 12 أسبوعًا، 3 فئات.<\u002Fp>\n      <p class=\"lg-tashkil\" style=\"max-inline-size:var(--lg-measure-ar);font-weight:var(--lg-w-strong)\">سطر يحمل تشكيلًا: «مَن يقرر… وماذا يبقى» و«قرارٌ» — حبر على أبيض، بلا استثناء.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">English · LTR · Instrument Sans · line-height 1.6<\u002Fp>\n      <div class=\"ds-scale\">\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">display 47.8/800<\u002Fspan><span style=\"font-size:var(--lg-text-display);font-weight:var(--lg-w-display);letter-spacing:var(--lg-track-display);line-height:var(--lg-lh-tight)\">Who decides<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">3xl 39.8/700<\u002Fspan><span style=\"font-size:var(--lg-text-3xl);font-weight:var(--lg-w-strong);letter-spacing:var(--lg-track-display)\">Authority thresholds<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">2xl 33.2/700<\u002Fspan><span style=\"font-size:var(--lg-text-2xl);font-weight:var(--lg-w-strong)\">Organisation design<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">xl 27.6/700<\u002Fspan><span style=\"font-size:var(--lg-text-xl);font-weight:var(--lg-w-strong)\">Intelligent operating model<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">md 19.2/400<\u002Fspan><span style=\"font-size:var(--lg-text-md)\">What remains after the decision<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">base 16/400<\u002Fspan><span style=\"font-size:var(--lg-text-base)\">Who decides, at which threshold, and what remains<\u002Fspan><\u002Fdiv>\n        <div class=\"ds-scale__row\"><span class=\"ds-key\">sm 13.3/400<\u002Fspan><span style=\"font-size:var(--lg-text-sm)\">Figure 1 · Authority threshold map<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"color:var(--lg-ink-secondary)\">Latin body at 16px, line-height 1.6, measure 66ch. Display sizes may take −0.02em tracking; Arabic never does. Emphasis is <strong>weight<\u002Fstrong>, colour, or a rule — <em>never slant<\u002Fem> (this em renders as weight by design).<\u002Fp>\n      <p style=\"font-weight:var(--lg-w-strong)\">Tabular figures everywhere: 500,000 · 12 · 3 · 1,250,000.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 5 · SPACE, GEOMETRY, MOTION -->\n<section class=\"ds-sec\" id=\"space\">\n  <p class=\"ds-sec__no\">05<\u002Fp>\n  <h2 class=\"ds-sec__title\">المسافة والزوايا والحركة<\u002Fh2>\n  <p class=\"ds-sec__note\">أساس 4px، وزوايا 0 / 2 / 4px، وحركة استجابة فقط بحد أقصى 150ms. الحدود والمساطر تحمل التسلسل البصري — لا ظل، ولا ارتفاع، ولا حركة عند التحميل أو التمرير.<\u002Fp>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">المسافة · 4px base<\u002Fp>\n      <div class=\"lg-stack lg-stack--tight\">\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-1 · 4px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-1)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-2 · 8px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-2)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-3 · 12px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-3)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-4 · 16px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-4)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-5 · 24px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-5)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-6 · 32px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-6)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-7 · 48px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-7)\"><\u002Fspan><\u002Fdiv>\n        <div class=\"ds-space__row\"><span class=\"ds-key\" dir=\"ltr\" lang=\"en\">space-8 · 64px<\u002Fspan><span class=\"ds-space__bar\" style=\"inline-size:var(--lg-space-8)\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">Radius &amp; motion — 0 / 2 / 4px, ≤150ms<\u002Fp>\n      <div class=\"lg-row\">\n        <span style=\"inline-size:5rem;block-size:3rem;border:1px solid var(--lg-border-strong);border-radius:var(--lg-radius-0);display:flex;align-items:center;justify-content:center;font-size:var(--lg-text-xs);color:var(--lg-ink-muted)\">0<\u002Fspan>\n        <span style=\"inline-size:5rem;block-size:3rem;border:1px solid var(--lg-border-strong);border-radius:var(--lg-radius-1);display:flex;align-items:center;justify-content:center;font-size:var(--lg-text-xs);color:var(--lg-ink-muted)\">2px<\u002Fspan>\n        <span style=\"inline-size:5rem;block-size:3rem;border:1px solid var(--lg-border-strong);border-radius:var(--lg-radius-2);display:flex;align-items:center;justify-content:center;font-size:var(--lg-text-xs);color:var(--lg-ink-muted)\">4px<\u002Fspan>\n      <\u002Fdiv>\n      <table class=\"lg-table\">\n        <tbody>\n          <tr><th scope=\"row\">--lg-dur-1<\u002Fth><td class=\"lg-table__num\">90ms<\u002Ftd><td>Hover, border, colour<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">--lg-dur-2<\u002Fth><td class=\"lg-table__num\">150ms<\u002Ftd><td>Ceiling — disclosure<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">--lg-ease<\u002Fth><td class=\"lg-table__num\" colspan=\"2\">cubic-bezier(0.2,0,0.4,1)<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p style=\"color:var(--lg-ink-muted);font-size:var(--lg-text-sm)\">Motion is feedback to a user action only. Nothing animates on load, on scroll, or ambiently. Every transition collapses to 0ms under <span class=\"ds-mono\">prefers-reduced-motion: reduce<\u002Fspan>.<\u002Fp>\n      <div class=\"lg-callout lg-callout--plain\">\n        <p class=\"lg-callout__title\">Focus ring<\u002Fp>\n        <p class=\"lg-callout__body\">One definition — 2px b-600 plus a 2px background offset — survives white, tint, and a filled blue button. Tab through this page. <span class=\"ds-mono\">outline:none<\u002Fspan> without a replacement is a bug.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 6 · COMPONENTS -->\n<section class=\"ds-sec\" id=\"components\">\n  <p class=\"ds-sec__no\">06<\u002Fp>\n  <h2 class=\"ds-sec__title\">المكوّنات في الاتجاهين<\u002Fh2>\n  <p class=\"ds-sec__note\">كل مكوّن يظهر عربيًا ولاتينيًا. كلها مبنية على الخصائص المنطقية، فلا يحتاج قلب الاتجاه إلى سطر واحد إضافي.<\u002Fp>\n\n  <h3 class=\"ds-sub\">الأزرار والروابط<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">عربي · RTL<\u002Fp>\n      <div class=\"lg-row\">\n        <button type=\"button\" class=\"lg-btn lg-btn--primary\">ابدأ التشخيص<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary\">اطلب المذكرة<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--quiet\">تفاصيل الطريقة<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--primary\" disabled=\"\">غير متاح<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"lg-row\">\n        <button type=\"button\" class=\"lg-btn lg-btn--primary lg-btn--sm\">حجم صغير<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary lg-btn--sm\">حجم صغير<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary lg-btn--sm\" disabled=\"\">معطّل<\u002Fbutton>\n      <\u002Fdiv>\n      <p>رابط داخل نص: <a class=\"lg-link\" href=\"#brand\">حدود الصلاحيات<\u002Fa> · <a class=\"lg-link lg-link--strong\" href=\"#findings\">ترميز النتائج<\u002Fa> · <a class=\"lg-link\" href=\"#\" aria-disabled=\"true\">رابط معطّل<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">English · LTR<\u002Fp>\n      <div class=\"lg-row\">\n        <button type=\"button\" class=\"lg-btn lg-btn--primary\">Start the diagnostic<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary\">Request the memo<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--quiet\">Method detail<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--primary\" disabled=\"\">Unavailable<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"lg-row\">\n        <button type=\"button\" class=\"lg-btn lg-btn--primary lg-btn--sm\">Small<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary lg-btn--sm\">Small<\u002Fbutton>\n        <button type=\"button\" class=\"lg-btn lg-btn--secondary lg-btn--sm\" disabled=\"\">Disabled<\u002Fbutton>\n      <\u002Fdiv>\n      <p>Inline link: <a class=\"lg-link\" href=\"#brand\">authority thresholds<\u002Fa> · <a class=\"lg-link lg-link--strong\" href=\"#findings\">findings encoding<\u002Fa> · <a class=\"lg-link\" href=\"#\" aria-disabled=\"true\">disabled link<\u002Fa><\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">الحقول<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">عربي · RTL<\u002Fp>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"ar-name\">الاسم الكامل <span class=\"lg-field__req\">*<\u002Fspan><\u002Flabel>\n        <input class=\"lg-input\" id=\"ar-name\" type=\"text\" placeholder=\"كما يظهر في السجل\">\n        <span class=\"lg-field__hint\">نستخدمه في المذكرة الموجهة إلى المجلس.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"ar-scope\">نطاق القرار<\u002Flabel>\n        <span class=\"lg-select-wrap\">\n          <select class=\"lg-select\" id=\"ar-scope\">\n            <option>مجلس الإدارة<\u002Foption>\n            <option>الرئيس التنفيذي<\u002Foption>\n            <option>لجنة الاستثمار<\u002Foption>\n          <\u002Fselect>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"ar-note\">ما القرار الذي تعطّل؟<\u002Flabel>\n        <textarea class=\"lg-textarea\" id=\"ar-note\" placeholder=\"اذكر القرار والحد والجهة\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"lg-field lg-field--invalid\">\n        <label class=\"lg-field__label\" for=\"ar-mail\">البريد الإلكتروني للعمل<\u002Flabel>\n        <input class=\"lg-input\" id=\"ar-mail\" type=\"email\" value=\"kholoud@\" aria-invalid=\"true\" aria-describedby=\"ar-mail-err\">\n        <span class=\"lg-field__error\" id=\"ar-mail-err\">لم يُرسل النموذج: العنوان غير مكتمل.<\u002Fspan>\n      <\u002Fdiv>\n      <fieldset>\n        <legend class=\"lg-field__label\" style=\"margin-block-end:var(--lg-space-2)\">ما الذي تريد تثبيته أولًا؟<\u002Flegend>\n        <label class=\"lg-choice\"><input type=\"radio\" name=\"ar-r\" checked=\"\"><span class=\"lg-choice__text\">حدود الصلاحيات<span class=\"lg-choice__hint\">مَن يقرر، وعند أي حد<\u002Fspan><\u002Fspan><\u002Flabel>\n        <label class=\"lg-choice\"><input type=\"radio\" name=\"ar-r\"><span class=\"lg-choice__text\">حقوق القرار<\u002Fspan><\u002Flabel>\n        <label class=\"lg-choice lg-choice--disabled\"><input type=\"radio\" name=\"ar-r\" disabled=\"\"><span class=\"lg-choice__text\">نموذج التشغيل (لاحقًا)<\u002Fspan><\u002Flabel>\n      <\u002Ffieldset>\n      <label class=\"lg-choice\"><input type=\"checkbox\" checked=\"\"><span class=\"lg-choice__text\">أوافق على استخدام المخرجات داخليًا<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">English · LTR<\u002Fp>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"en-name\">Full name <span class=\"lg-field__req\">*<\u002Fspan><\u002Flabel>\n        <input class=\"lg-input\" id=\"en-name\" type=\"text\" placeholder=\"As it appears on record\">\n        <span class=\"lg-field__hint\">Used on the memo addressed to the board.<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"en-scope\">Decision scope<\u002Flabel>\n        <span class=\"lg-select-wrap\">\n          <select class=\"lg-select\" id=\"en-scope\">\n            <option>Board<\u002Foption>\n            <option>Chief executive<\u002Foption>\n            <option>Investment committee<\u002Foption>\n          <\u002Fselect>\n        <\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"lg-field\">\n        <label class=\"lg-field__label\" for=\"en-note\">Which decision is stalled?<\u002Flabel>\n        <textarea class=\"lg-textarea\" id=\"en-note\" placeholder=\"Name the decision, the threshold, the holder\"><\u002Ftextarea>\n      <\u002Fdiv>\n      <div class=\"lg-field lg-field--invalid\">\n        <label class=\"lg-field__label\" for=\"en-mail\">Work email<\u002Flabel>\n        <input class=\"lg-input\" id=\"en-mail\" type=\"email\" value=\"kholoud@\" aria-invalid=\"true\" aria-describedby=\"en-mail-err\">\n        <span class=\"lg-field__error\" id=\"en-mail-err\">Not submitted: the address is incomplete.<\u002Fspan>\n      <\u002Fdiv>\n      <fieldset>\n        <legend class=\"lg-field__label\" style=\"margin-block-end:var(--lg-space-2)\">What should be fixed first?<\u002Flegend>\n        <label class=\"lg-choice\"><input type=\"radio\" name=\"en-r\" checked=\"\"><span class=\"lg-choice__text\">Authority thresholds<span class=\"lg-choice__hint\">Who decides, at which limit<\u002Fspan><\u002Fspan><\u002Flabel>\n        <label class=\"lg-choice\"><input type=\"radio\" name=\"en-r\"><span class=\"lg-choice__text\">Decision rights<\u002Fspan><\u002Flabel>\n        <label class=\"lg-choice lg-choice--disabled\"><input type=\"radio\" name=\"en-r\" disabled=\"\"><span class=\"lg-choice__text\">Operating model (later)<\u002Fspan><\u002Flabel>\n      <\u002Ffieldset>\n      <label class=\"lg-choice\"><input type=\"checkbox\" checked=\"\"><span class=\"lg-choice__text\">Internal use of the outputs is agreed<\u002Fspan><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">البطاقة والنداء<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">عربي · RTL<\u002Fp>\n      <div class=\"lg-grid lg-grid--halves\">\n        <article class=\"lg-card\">\n          <p class=\"lg-card__eyebrow\">الخطوة 1<\u002Fp>\n          <h4 class=\"lg-card__title\">جرد القرارات<\u002Fh4>\n          <p class=\"lg-card__body\">نُخرج قائمة القرارات الفعلية من أربعة أسابيع من الاجتماعات، لا من الهيكل المعلن.<\u002Fp>\n          <p class=\"lg-card__foot\">مُخرَج: قائمة قرارات مُرقّمة<\u002Fp>\n        <\u002Farticle>\n        <article class=\"lg-card lg-card--accent\">\n          <p class=\"lg-card__eyebrow\">موضع النظر<\u002Fp>\n          <p class=\"lg-card__num\">12<\u002Fp>\n          <p class=\"lg-card__body\">قرارًا تجاوز حدّه المعلن في الربع الأخير.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <div class=\"lg-callout\">\n        <p class=\"lg-callout__title\">قاعدة<\u002Fp>\n        <p class=\"lg-callout__body\">القرار الذي لا يملكه أحد ليس قرارًا متأخرًا، بل قرار غائب. الفرق يحدد العلاج.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"lg-callout lg-callout--critical\" role=\"status\">\n        <p class=\"lg-callout__title\">لم يُرسل النموذج<\u002Fp>\n        <p class=\"lg-callout__body\">هذا اللون للفشل الواجهي فقط. لا يظهر في أي تشخيص يراه العميل.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">English · LTR<\u002Fp>\n      <div class=\"lg-grid lg-grid--halves\">\n        <article class=\"lg-card\">\n          <p class=\"lg-card__eyebrow\">Step 1<\u002Fp>\n          <h4 class=\"lg-card__title\">Decision inventory<\u002Fh4>\n          <p class=\"lg-card__body\">The list of decisions actually taken across four weeks of meetings — not the ones the chart implies.<\u002Fp>\n          <p class=\"lg-card__foot\">Output: a numbered decision list<\u002Fp>\n        <\u002Farticle>\n        <article class=\"lg-card lg-card--accent\">\n          <p class=\"lg-card__eyebrow\">The item in question<\u002Fp>\n          <p class=\"lg-card__num\">12<\u002Fp>\n          <p class=\"lg-card__body\">decisions crossed their stated threshold last quarter.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <div class=\"lg-callout\">\n        <p class=\"lg-callout__title\">Rule<\u002Fp>\n        <p class=\"lg-callout__body\">A decision nobody holds is not a late decision. It is an absent one, and the difference sets the remedy.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"lg-callout lg-callout--critical\" role=\"status\">\n        <p class=\"lg-callout__title\">Not submitted<\u002Fp>\n        <p class=\"lg-callout__body\">This colour is for interface failure only. It never appears in client-facing findings.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">التنقل<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">عربي · RTL<\u002Fp>\n      <nav class=\"lg-breadcrumb\" aria-label=\"المسار\">\n        <ol><li><a href=\"#\">الرئيسية<\u002Fa><\u002Fli><li><a href=\"#\">المختبر<\u002Fa><\u002Fli><li><span aria-current=\"page\">حدود الصلاحيات<\u002Fspan><\u002Fli><\u002Fol>\n      <\u002Fnav>\n      <nav class=\"lg-inpage\" aria-label=\"في هذه الصفحة\">\n        <p class=\"lg-inpage__title\">في هذه الصفحة<\u002Fp>\n        <ol>\n          <li><a href=\"#brand\" aria-current=\"true\">الهوية<\u002Fa><\u002Fli>\n          <li><a href=\"#colour\">اللون<\u002Fa><\u002Fli>\n          <li><a href=\"#type\">الطباعة<\u002Fa><\u002Fli>\n          <li><a href=\"#findings\">النتائج<\u002Fa><\u002Fli>\n        <\u002Fol>\n      <\u002Fnav>\n      <div class=\"lg-accordion\">\n        <details class=\"lg-accordion__item\" open=\"\">\n          <summary>ما الذي يُسلَّم في نهاية المختبر؟<span class=\"lg-accordion__sign\" aria-hidden=\"true\"><\u002Fspan><\u002Fsummary>\n          <div class=\"lg-accordion__panel\">جدول حدود صلاحيات مُعتمد، وشبكة حقوق قرار، ومذكرة من ست صفحات إلى المجلس. لا عرض تقديمي.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"lg-accordion__item\">\n          <summary>كم تستغرق المدة؟<span class=\"lg-accordion__sign\" aria-hidden=\"true\"><\u002Fspan><\u002Fsummary>\n          <div class=\"lg-accordion__panel\">6 أسابيع للتشخيص، و12 أسبوعًا حتى تثبيت التغيير في نموذج التشغيل.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n      <nav class=\"lg-pagination\" aria-label=\"الصفحات\">\n        <a class=\"lg-pagination__edge\" href=\"#\">السابق<\u002Fa>\n        <ul><li><a href=\"#\">1<\u002Fa><\u002Fli><li><span aria-current=\"page\">2<\u002Fspan><\u002Fli><li><a href=\"#\">3<\u002Fa><\u002Fli><li><span class=\"lg-pagination__gap\">…<\u002Fspan><\u002Fli><li><a href=\"#\">9<\u002Fa><\u002Fli><\u002Ful>\n        <a class=\"lg-pagination__edge\" href=\"#\">التالي<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">English · LTR<\u002Fp>\n      <nav class=\"lg-breadcrumb\" aria-label=\"Breadcrumb\">\n        <ol><li><a href=\"#\">Home<\u002Fa><\u002Fli><li><a href=\"#\">The lab<\u002Fa><\u002Fli><li><span aria-current=\"page\">Authority thresholds<\u002Fspan><\u002Fli><\u002Fol>\n      <\u002Fnav>\n      <nav class=\"lg-inpage\" aria-label=\"On this page\">\n        <p class=\"lg-inpage__title\">On this page<\u002Fp>\n        <ol>\n          <li><a href=\"#brand\" aria-current=\"true\">Brand<\u002Fa><\u002Fli>\n          <li><a href=\"#colour\">Colour<\u002Fa><\u002Fli>\n          <li><a href=\"#type\">Type<\u002Fa><\u002Fli>\n          <li><a href=\"#findings\">Findings<\u002Fa><\u002Fli>\n        <\u002Fol>\n      <\u002Fnav>\n      <div class=\"lg-accordion\">\n        <details class=\"lg-accordion__item\" open=\"\">\n          <summary>What is delivered at the end?<span class=\"lg-accordion__sign\" aria-hidden=\"true\"><\u002Fspan><\u002Fsummary>\n          <div class=\"lg-accordion__panel\">An approved authority-threshold table, a decision-rights grid, and a six-page memo to the board. No slide deck.<\u002Fdiv>\n        <\u002Fdetails>\n        <details class=\"lg-accordion__item\">\n          <summary>How long does it take?<span class=\"lg-accordion__sign\" aria-hidden=\"true\"><\u002Fspan><\u002Fsummary>\n          <div class=\"lg-accordion__panel\">6 weeks to diagnose; 12 weeks to hold the change inside the operating model.<\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fdiv>\n      <nav class=\"lg-pagination\" aria-label=\"Pages\">\n        <a class=\"lg-pagination__edge\" href=\"#\">Previous<\u002Fa>\n        <ul><li><a href=\"#\">1<\u002Fa><\u002Fli><li><span aria-current=\"page\">2<\u002Fspan><\u002Fli><li><a href=\"#\">3<\u002Fa><\u002Fli><li><span class=\"lg-pagination__gap\">…<\u002Fspan><\u002Fli><li><a href=\"#\">9<\u002Fa><\u002Fli><\u002Ful>\n        <a class=\"lg-pagination__edge\" href=\"#\">Next<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 7 · FINDINGS -->\n<section class=\"ds-sec\" id=\"findings\">\n  <p class=\"ds-sec__no\">07<\u002Fp>\n  <h2 class=\"ds-sec__title\">ترميز النتائج بالحضور والغياب<\u002Fh2>\n  <p class=\"ds-sec__note\">لا أحمر، ولا كهرماني، ولا أخضر في أي مخرج يراه العميل. المملوك حبرٌ وحدّ صريح؛ المُسمّى دون إسناد خليةٌ فارغة بحدّ باهت؛ الغائب تهشيرٌ قطري؛ وموضع النظر مسطرة زرقاء 2px على بداية السطر مع تعبئة فاتحة.<\u002Fp>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">جدول حدود الصلاحيات · عربي<\u002Fp>\n      <div class=\"lg-table-scroll\">\n        <table class=\"lg-table lg-table--authority\">\n          <caption>الشكل 1 · حدود الصلاحيات المعتمدة — الربع الثالث<\u002Fcaption>\n          <thead><tr><th scope=\"col\">القرار<\u002Fth><th scope=\"col\">الحد<\u002Fth><th scope=\"col\">صاحب القرار<\u002Fth><th scope=\"col\">ما بعد الحد<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><th scope=\"row\">الإنفاق الرأسمالي<\u002Fth><td class=\"lg-threshold\">≤ 500,000<\u002Ftd><td class=\"lg-holder\">الرئيس التنفيذي<\u002Ftd><td class=\"lg-escalation\">لجنة الاستثمار<\u002Ftd><\u002Ftr>\n            <tr class=\"lg-row--pointed\"><th scope=\"row\">إسناد الأعمال لجهة خارجية<\u002Fth><td class=\"lg-threshold\">≤ 1,250,000<\u002Ftd><td class=\"lg-holder\">مدير العمليات<\u002Ftd><td class=\"lg-escalation\">الرئيس التنفيذي<\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">التعيينات في الإدارة العليا<\u002Fth><td class=\"lg-threshold\">أي مستوى<\u002Ftd><td class=\"lg-holder\">المجلس<\u002Ftd><td class=\"lg-escalation\">—<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">السطر الثاني هو موضع النظر: حدّه مضاعف لحد المشروع الذي يخدمه. المسطرة الزرقاء تشير، ولا تلوم.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">Authority-threshold table · English<\u002Fp>\n      <div class=\"lg-table-scroll\">\n        <table class=\"lg-table lg-table--authority\">\n          <caption>Figure 1 · Approved authority thresholds — Q3<\u002Fcaption>\n          <thead><tr><th scope=\"col\">Decision<\u002Fth><th scope=\"col\">Threshold<\u002Fth><th scope=\"col\">Holder<\u002Fth><th scope=\"col\">Above it<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><th scope=\"row\">Capital expenditure<\u002Fth><td class=\"lg-threshold\">≤ 500,000<\u002Ftd><td class=\"lg-holder\">Chief executive<\u002Ftd><td class=\"lg-escalation\">Investment committee<\u002Ftd><\u002Ftr>\n            <tr class=\"lg-row--pointed\"><th scope=\"row\">Outsourcing a function<\u002Fth><td class=\"lg-threshold\">≤ 1,250,000<\u002Ftd><td class=\"lg-holder\">Operations director<\u002Ftd><td class=\"lg-escalation\">Chief executive<\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">Senior appointments<\u002Fth><td class=\"lg-threshold\">Any level<\u002Ftd><td class=\"lg-holder\">Board<\u002Ftd><td class=\"lg-escalation\">—<\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">Row two is the item being pointed at. The rule points; it does not blame.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"ds-pair\" style=\"margin-block-start:var(--lg-space-7)\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">شبكة حقوق القرار · عربي<\u002Fp>\n      <div class=\"lg-table-scroll\">\n        <table class=\"lg-rights\">\n          <caption>الشكل 2 · حقوق القرار — من يقرر، من يوافق، من يُستشار<\u002Fcaption>\n          <thead><tr><th scope=\"col\">القرار<\u002Fth><th scope=\"col\">المجلس<\u002Fth><th scope=\"col\">الرئيس التنفيذي<\u002Fth><th scope=\"col\">لجنة الاستثمار<\u002Fth><th scope=\"col\">مالك المنتج<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><th scope=\"row\">الإنفاق الرأسمالي<\u002Fth><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يوافق<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يقرر<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يُستشار<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">تسعير الخدمة<\u002Fth><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><span class=\"lg-escalation\">مُسمّى دون إسناد<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يُبلَّغ<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">إيقاف مشروع متعثر<\u002Fth><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">غائب<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">غائب<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">غائب<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">غائب<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">تغيير نموذج التشغيل<\u002Fth><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يقرر<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--pointed\"><span class=\"lg-mark\">يوافق<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">يُستشار<\u002Fspan><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"lg-legend\">\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key\" aria-hidden=\"true\"><\u002Fspan>مملوك<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--unassigned\" aria-hidden=\"true\"><\u002Fspan>مُسمّى دون إسناد<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--absent\" aria-hidden=\"true\"><\u002Fspan>غائب<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--pointed\" aria-hidden=\"true\"><\u002Fspan>موضع النظر<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">صف «إيقاف مشروع متعثر» غائب بالكامل: لا أحد يقرر. هذه بنية، لا تقصير شخصي — ولهذا لا لون تحذيري.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <p class=\"ds-tag\">Decision-rights grid · English<\u002Fp>\n      <div class=\"lg-table-scroll\">\n        <table class=\"lg-rights\">\n          <caption>Figure 2 · Decision rights — decides, approves, consulted<\u002Fcaption>\n          <thead><tr><th scope=\"col\">Decision<\u002Fth><th scope=\"col\">Board<\u002Fth><th scope=\"col\">Chief exec.<\u002Fth><th scope=\"col\">Invest. cttee<\u002Fth><th scope=\"col\">Product owner<\u002Fth><\u002Ftr><\u002Fthead>\n          <tbody>\n            <tr><th scope=\"row\">Capital expenditure<\u002Fth><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Approves<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Decides<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Consulted<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">Service pricing<\u002Fth><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><span class=\"lg-escalation\">Named, unassigned<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Informed<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">Stopping a stalled project<\u002Fth><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">Absent<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">Absent<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">Absent<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--absent\"><span class=\"lg-cell__label\">Absent<\u002Fspan><\u002Ftd><\u002Ftr>\n            <tr><th scope=\"row\">Changing the operating model<\u002Fth><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Decides<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--pointed\"><span class=\"lg-mark\">Approves<\u002Fspan><\u002Ftd><td class=\"lg-cell lg-cell--unassigned\"><\u002Ftd><td class=\"lg-cell lg-cell--held\"><span class=\"lg-mark\">Consulted<\u002Fspan><\u002Ftd><\u002Ftr>\n          <\u002Ftbody>\n        <\u002Ftable>\n      <\u002Fdiv>\n      <div class=\"lg-legend\">\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key\" aria-hidden=\"true\"><\u002Fspan>Held<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--unassigned\" aria-hidden=\"true\"><\u002Fspan>Named, unassigned<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--absent\" aria-hidden=\"true\"><\u002Fspan>Absent<\u002Fspan>\n        <span class=\"lg-legend__item\"><span class=\"lg-legend__key lg-legend__key--pointed\" aria-hidden=\"true\"><\u002Fspan>The item in question<\u002Fspan>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">Nobody decides in the “stopping a stalled project” row. That is structure, not fault — which is why no warning colour appears.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8 · RULES -->\n<section class=\"ds-sec\" id=\"rules\">\n  <p class=\"ds-sec__no\">08<\u002Fp>\n  <h2 class=\"ds-sec__title\">القواعد والمحظورات<\u002Fh2>\n  <p class=\"ds-sec__note\">هذه القواعد ليست تفضيلات. أي مخرج يخالف واحدة منها يُعاد، ولو كان جميلًا.<\u002Fp>\n  <div class=\"ds-rules\">\n    <ul>\n      <li><b>1<\u002Fb><span class=\"ds-do\">الخصائص المنطقية فقط: <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">margin-inline-start<\u002Fspan> لا <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">margin-left<\u002Fspan>. أي خصيصة فيزيائية خارج الحالات الحدّية خطأ.<\u002Fspan><\u002Fli>\n      <li><b>2<\u002Fb><span class=\"ds-do\">العربية أولًا في كل ملف: المحتوى العربي يُكتب أولًا ويُختبر أولًا، والإنجليزية توأم مكافئ.<\u002Fspan><\u002Fli>\n      <li><b>3<\u002Fb><span class=\"ds-do\">التشكيل حبرٌ كامل على أرضية بيضاء. لا يُخفَّف، ولا يوضع على أرضية ملوّنة، ولا يُحذف من الشعار.<\u002Fspan><\u002Fli>\n      <li><b>4<\u002Fb><span class=\"ds-do\">كل زوج نص/أرضية ≥ 4.5:1. المعطّل وحده مستثنى.<\u002Fspan><\u002Fli>\n      <li><b>5<\u002Fb><span class=\"ds-do\">الخطوط مستضافة محليًا. صفر طلب خارجي، ولا خدمة خطوط، ولا نص برمجي من شبكة توصيل.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n    <ul>\n      <li><b>6<\u002Fb><span class=\"ds-dont\">لا أحمر/كهرماني/أخضر كمؤشرات في مخرجات العميل. الحضور والغياب والحدود والتهشير تكفي.<\u002Fspan><\u002Fli>\n      <li><b>7<\u002Fb><span class=\"ds-dont\">لا ظل، ولا تدرّج، ولا لون ثالث، ولا زوايا أكبر من 4px.<\u002Fspan><\u002Fli>\n      <li><b>8<\u002Fb><span class=\"ds-dont\">لا حركة تلقائية: لا عند التحميل، ولا عند التمرير. الحركة استجابة لفعل فقط، وبحد 150ms.<\u002Fspan><\u002Fli>\n      <li><b>9<\u002Fb><span class=\"ds-dont\">لا صور مولّدة، ولا صور مخزنية للمصافحات والزجاج، ولا حاجة إلى شعارات عملاء لتثبيت تصميم.<\u002Fspan><\u002Fli>\n      <li><b>10<\u002Fb><span class=\"ds-dont\">النقطة الكهرمانية داخل العلامة فقط. لا تُنسخ إلى واجهة ولا مخطط ولا نص.<\u002Fspan><\u002Fli>\n    <\u002Ful>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9 · TESTS -->\n<section class=\"ds-sec\" id=\"tests\">\n  <p class=\"ds-sec__no\">09<\u002Fp>\n  <h2 class=\"ds-sec__title\">اختبارات القبول<\u002Fh2>\n  <p class=\"ds-sec__note\">النظام يُقاس، لا يُستحسن. هذه هي الاختبارات ونتائجها على هذا الإصدار.<\u002Fp>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\" dir=\"ltr\" lang=\"en\">\n      <table class=\"lg-table ds-results\">\n        <thead><tr><th scope=\"col\">#<\u002Fth><th scope=\"col\">Test<\u002Fth><th scope=\"col\">Result<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><td class=\"lg-table__num\">1<\u002Ftd><td>Lockup at 16 / 32 / 96px — tashkil intact, ج not clipped<\u002Ftd><td class=\"ds-pass\">Pass<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">2<\u002Ftd><td>Arabic lockup mirrors the mark and reads right-to-left<\u002Ftd><td class=\"ds-pass\">Pass — assets/logo-ar.svg<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">3<\u002Ftd><td>Physical CSS properties in shipped CSS<\u002Ftd><td class=\"ds-pass\">0<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">4<\u002Ftd><td>Mirror test — flip dir on &lt;html&gt;<\u002Ftd><td class=\"ds-pass\">Pass — use the toggle above<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">5<\u002Ftd><td>Every shipped text/background pair ≥ 4.5:1<\u002Ftd><td class=\"ds-pass\">Pass — disabled ink exempt<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">6<\u002Ftd><td>Almarai retains U+064B–U+0652 (tashkil)<\u002Ftd><td class=\"ds-pass\">Pass — unsubset TTF, marks and GPOS intact<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">7<\u002Ftd><td>Blue coverage ≈ 10% of viewport<\u002Ftd><td class=\"ds-pass\">Pass<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">8<\u002Ftd><td>Zero external network requests<\u002Ftd><td class=\"ds-pass\">Pass — fonts self-hosted from fonts/<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">9<\u002Ftd><td>Motion collapses under prefers-reduced-motion<\u002Ftd><td class=\"ds-pass\">Pass<\u002Ftd><\u002Ftr>\n          <tr><td class=\"lg-table__num\">10<\u002Ftd><td>No status colour in any client-facing finding<\u002Ftd><td class=\"ds-pass\">Pass — presence, border, hatch only<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n    <\u002Fdiv>\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">الملفات<\u002Fp>\n      <table class=\"lg-table\">\n        <tbody>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">styles.css<\u002Fth><td>نقطة الدخول — أسطر استيراد فقط<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">tokens/*.css<\u002Fth><td>الخطوط، اللون، المسافة، الحركة<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">base.css<\u002Fth><td>التصفير، ربط الطباعة، الاتجاه، حلقة التركيز<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">components.css<\u002Fth><td>كل المكوّنات المعروضة أعلاه<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">assets/logo.svg<\u002Fth><td>الكتلة اللاتينية<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">assets/logo-ar.svg<\u002Fth><td>الكتلة العربية (تشير إلى الخط في fonts/)<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">assets/logo-ar-embedded.svg<\u002Fth><td>الكتلة العربية بخط مدمج — للاستخدام في &lt;img&gt; وللتسليم<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">assets/mark.svg · mark-rtl.svg<\u002Fth><td>العلامة وحدها، ومقلوبة<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\" dir=\"ltr\" lang=\"en\">fonts/*.ttf<\u002Fth><td>المرعي 300/400/700/800 · إنسترمنت سانس 400/500/600/700<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lg-figure__caption\">الوسم العربي في <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">logo-ar.svg<\u002Fspan> مضبوط نصًا بخط المرعي 800. قبل الطبع النهائي يُحوَّل إلى مسارات مرة واحدة، فيصبح الملف مستقلًا عن أي خط.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer class=\"lg-footer\">\n  <div class=\"lg-footer__inner\">\n    <div>\n      <div class=\"lg-lockup lg-lockup--sm\" style=\"margin-block-end:var(--lg-space-4)\">\n        <img class=\"lg-lockup__mark\" src=\"141e667c-30d0-4f64-88bc-dbf99ae2df94\" alt=\"\">\n        <div class=\"lg-lockup__lines\">\n          <span class=\"lg-lockup__wordmark\">لينك جوروز<\u002Fspan>\n          <span class=\"lg-lockup__corporate lg-tashkil\">«مَن يقرر… وماذا يبقى»<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"max-inline-size:28ch\">استشارات إدارية للمجالس والرؤساء التنفيذيين. الرياض · المملكة العربية السعودية.<\u002Fp>\n    <\u002Fdiv>\n    <div>\n      <h2>الفئات الثلاث<\u002Fh2>\n      <ul>\n        <li><a href=\"#brand\">المختبر<\u002Fa><\u002Fli>\n        <li><a href=\"#components\">البنية والتصميم المؤسسي<\u002Fa><\u002Fli>\n        <li><a href=\"#findings\">نموذج التشغيل الذكي<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n    <div>\n      <h2>النظام<\u002Fh2>\n      <ul>\n        <li><a href=\"#colour\">اللون والطباعة<\u002Fa><\u002Fli>\n        <li><a href=\"#rules\">القواعد والمحظورات<\u002Fa><\u002Fli>\n        <li><a href=\"#tests\">اختبارات القبول<\u002Fa><\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <p class=\"lg-footer__legal\">لينك جوروز 2026 · نظام التصميم، الإصدار 1.1 · العربية أولًا، والاتجاهان متكافئان.<\u002Fp>\n<\u002Ffooter>\n<\u002Fdiv>\n\n<script>\n(function(){\n  var rtl=document.getElementById('dir-rtl'),ltr=document.getElementById('dir-ltr'),h=document.documentElement;\n  function set(dir){h.setAttribute('dir',dir);h.setAttribute('lang',dir==='rtl'?'ar':'en');\n    rtl.setAttribute('aria-pressed',dir==='rtl');ltr.setAttribute('aria-pressed',dir==='ltr');\n    try{localStorage.setItem('lg-ds-dir',dir)}catch(e){}}\n  rtl.addEventListener('click',function(){set('rtl')});\n  ltr.addEventListener('click',function(){set('ltr')});\n  try{var s=localStorage.getItem('lg-ds-dir');if(s==='ltr')set('ltr')}catch(e){}\n\n  var links=[].slice.call(document.querySelectorAll('.ds-nav__list a'));\n  var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a});\n  var seen={};\n  function paint(){\n    var current=null;\n    for(var i=0;i<links.length;i++){var id=links[i].getAttribute('href').slice(1);if(seen[id])current=id}\n    links.forEach(function(a){\n      var on=a.getAttribute('href').slice(1)===current;\n      if(on)a.setAttribute('aria-current','true');else a.removeAttribute('aria-current');\n    });\n  }\n  if('IntersectionObserver' in window){\n    var io=new IntersectionObserver(function(entries){\n      entries.forEach(function(e){seen[e.target.id]=e.isIntersecting});paint();\n    },{rootMargin:'-25% 0px -60% 0px'});\n    Object.keys(map).forEach(function(id){var el=document.getElementById(id);if(el)io.observe(el)});\n  }\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
