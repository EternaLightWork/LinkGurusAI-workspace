  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html dir=\"rtl\" lang=\"ar\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<title>لينك جوروز — نظام التصميم / Linkgurus design system<\u002Ftitle>\n<style>/* Linkgurus design system — global entry point. Import lines only. */\n/* Linkgurus webfonts — self-hosted only. No CDN, no Google Fonts request, ever.\n   Binaries live in fonts/ as the full upstream TTFs — not subset, so Almarai's tashkil\n   (U+064B–U+0652) and the GPOS mark positioning that places it are intact by construction.\n   local() is listed first so an installed copy is used without a file read.\n   Instrument Sans Condensed and SemiCondensed are present in fonts/ but deliberately\n   unwired: the system uses one width. See assets/fonts/README.md. */\n\n@font-face{font-family:\"Almarai\";src:local(\"Almarai Light\"),local(\"Almarai-Light\"),url(\"ce9f4d64-f03e-4e4a-8c7a-1cd096ac35f6\") format(\"truetype\");font-weight:300;font-style:normal;font-display:swap}\n@font-face{font-family:\"Almarai\";src:local(\"Almarai\"),local(\"Almarai-Regular\"),url(\"96bf6892-6b9c-4d0b-8995-91b929291f22\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Almarai\";src:local(\"Almarai Bold\"),local(\"Almarai-Bold\"),url(\"599ba639-e8eb-44e5-8bdc-b6f35ff3b2e1\") format(\"truetype\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Almarai\";src:local(\"Almarai ExtraBold\"),local(\"Almarai-ExtraBold\"),url(\"b035a0cf-967f-4f41-b558-c040c053fd3d\") format(\"truetype\");font-weight:800;font-style:normal;font-display:swap}\n\n@font-face{font-family:\"Instrument Sans\";src:local(\"Instrument Sans\"),url(\"3264496b-0790-4508-860e-195928317b6f\") format(\"truetype\");font-weight:400;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"86b6542d-f308-4a14-9f3f-cea234410377\") format(\"truetype\");font-weight:400;font-style:italic;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:local(\"Instrument Sans Medium\"),url(\"a1ba0d2a-4d31-412f-90c6-3a5a5d397dca\") format(\"truetype\");font-weight:500;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"d0c78781-a119-431d-9892-81ad419dd7de\") format(\"truetype\");font-weight:500;font-style:italic;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:local(\"Instrument Sans SemiBold\"),url(\"24066be5-a125-446a-b15a-87656dfa6e73\") format(\"truetype\");font-weight:600;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"0152d7b9-d40b-465a-935a-cc1b13c2850d\") format(\"truetype\");font-weight:600;font-style:italic;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:local(\"Instrument Sans Bold\"),url(\"336b17db-ff83-4b9b-a613-7bdc9adb658b\") format(\"truetype\");font-weight:700;font-style:normal;font-display:swap}\n@font-face{font-family:\"Instrument Sans\";src:url(\"8b46d60e-6956-489a-81b0-a44826ca73db\") format(\"truetype\");font-weight:700;font-style:italic;font-display:swap}\n\n/* ═══════════════════════════════════════════════════════════════════════════\n   Linkgurus — tokens\n   Layer 1 primitives  →  Layer 2 semantic aliases  →  Layer 3 component tokens\n   Components may reference LAYER 2 and LAYER 3 only. Never a primitive.\n   ═══════════════════════════════════════════════════════════════════════════ */\n\n/* ───────────────────────── LAYER 1 — PRIMITIVES ───────────────────────── */\n:root{\n  /* neutral */\n  --lg-n-0:#FFFFFF;   --lg-n-25:#FAFAFB;  --lg-n-50:#F4F5F6;  --lg-n-100:#EAEBEC;\n  --lg-n-200:#DDDDDD; --lg-n-300:#C6C7C8; --lg-n-400:#A0A1A2; --lg-n-500:#7B7C7D;\n  --lg-n-600:#585858; --lg-n-700:#3B3B3C; --lg-n-800:#242425; --lg-n-900:#131314;\n  --lg-n-950:#080808;\n\n  /* blue — the only hue in the system */\n  --lg-b-50:#F2F3FF;  --lg-b-100:#DEE7FF; --lg-b-200:#B9CEFF; --lg-b-300:#84ACFF;\n  --lg-b-400:#3D85FF; --lg-b-500:#005CFF; --lg-b-600:#0047C4; --lg-b-700:#003693;\n  --lg-b-800:#002A73; --lg-b-900:#001C4D;\n\n  /* amber — the brand's second hue. Emphasis only, never status (§3.7).\n     a-400 #FBB400 is the mark's dot and the only amber that may be a fill.\n     a-700 is the only amber allowed on text; white is never placed on amber. */\n  --lg-a-50:#FFF7E3;  --lg-a-100:#FFECBF; --lg-a-200:#FFDC8A; --lg-a-300:#FFC94D;\n  --lg-a-400:#FBB400; --lg-a-500:#DE9E00; --lg-a-600:#B67F00; --lg-a-700:#8C6000;\n  --lg-a-800:#684700; --lg-a-900:#432E00;\n\n  /* interface-failure red — primitive exists so it is never eyeballed.\n     Permitted use is defined in Layer 2 (--lg-critical) and §3.6 of SYSTEM.md. */\n  --lg-r-600:#A32013; --lg-r-700:#7E1810; --lg-r-50:#FDF0EE;\n\n  /* type families */\n  --lg-font-ar:\"Almarai\",\"Noto Kufi Arabic\",\"Segoe UI\",Tahoma,system-ui,sans-serif;\n  --lg-font-latin:\"Instrument Sans\",system-ui,-apple-system,\"Segoe UI\",sans-serif;\n\n  /* type metrics — Almarai x-height 514 / cap 716; Instrument Sans 510 / 720.\n     Within 4 units per 1000, so one font-size serves both scripts. */\n  --lg-lh-ar:1.9;                /* @kind font */\n  --lg-lh-latin:1.6;             /* @kind font */\n  --lg-lh-tight:1.25;            /* @kind font */          /* display sizes, Latin only */\n  --lg-lh-ar-display:1.55;       /* @kind font */     /* Arabic display: room for tashkil + descenders */\n  --lg-ar-scale:1.08;            /* @kind font */          /* Arabic optical uplift, applied once per root */\n  --lg-w-light:300;              /* @kind font */\n  --lg-w-body:400;               /* @kind font */\n  --lg-w-medium:500;             /* @kind font */           /* Latin only — Almarai has no 500, never synthesise */\n  --lg-w-strong:700;             /* @kind font */\n  --lg-w-display:800;            /* @kind font */\n\n  /* type scale — single ratio 1.2 from a 16px root */\n  --lg-text-xs:0.75rem;        /* 12px  — legal/meta only, never Arabic body */\n  --lg-text-sm:0.833rem;       /* 13.3px */\n  --lg-text-base:1rem;         /* 16px  — body */\n  --lg-text-md:1.2rem;         /* 19.2px */\n  --lg-text-lg:1.44rem;        /* 23px */\n  --lg-text-xl:1.728rem;       /* 27.6px */\n  --lg-text-2xl:2.074rem;      /* 33.2px */\n  --lg-text-3xl:2.488rem;      /* 39.8px */\n  --lg-text-display:2.986rem;  /* 47.8px */\n\n  --lg-track-display:-0.02em;    /* @kind font */  /* Latin display only. Arabic: always 0. */\n  --lg-track-flat:0;             /* @kind font */\n\n  /* space — 4px base */\n  --lg-space-0:0;      --lg-space-1:0.25rem; --lg-space-2:0.5rem;  --lg-space-3:0.75rem;\n  --lg-space-4:1rem;   --lg-space-5:1.5rem;  --lg-space-6:2rem;    --lg-space-7:3rem;\n  --lg-space-8:4rem;   --lg-space-9:6rem;    --lg-space-10:8rem;\n\n  /* measure */\n  --lg-measure-latin:66ch;       /* @kind spacing */\n  --lg-measure-ar:56ch;          /* @kind spacing */\n\n  /* geometry — 0, 2px, 4px. Nothing larger exists. */\n  --lg-radius-0:0;\n  --lg-radius-1:2px;\n  --lg-radius-2:4px;\n  --lg-hair:1px;                 /* @kind spacing */\n  --lg-rule:2px;                 /* @kind spacing */\n\n  /* motion — feedback to a user action only; never load, scroll or ambient */\n  --lg-dur-instant:0ms;          /* @kind other */\n  --lg-dur-1:90ms;               /* @kind other */\n  --lg-dur-2:150ms;              /* @kind other */            /* hard ceiling */\n  --lg-ease:cubic-bezier(0.2,0,0.4,1); /* @kind other */\n  --lg-transition-ui:color var(--lg-dur-1) var(--lg-ease),\n                     background-color var(--lg-dur-1) var(--lg-ease),\n                     border-color var(--lg-dur-1) var(--lg-ease),\n                     box-shadow var(--lg-dur-1) var(--lg-ease);\n\n  /* container */\n  --lg-container:76rem;\n  --lg-container-narrow:52rem;\n  --lg-gutter:var(--lg-space-5);\n}\n\n/* ─────────────────── LAYER 2 — SEMANTIC ALIASES ───────────────────\n   The only names a component is allowed to reference. */\n:root{\n  --lg-bg:var(--lg-n-0);              --lg-surface:var(--lg-n-50);\n  --lg-surface-sunk:var(--lg-n-25);   --lg-surface-press:var(--lg-n-100);\n  --lg-tint:var(--lg-b-50);\n  --lg-tint-strong:var(--lg-b-100);\n\n  --lg-ink:var(--lg-n-950);           --lg-ink-secondary:var(--lg-n-700);\n  --lg-ink-muted:var(--lg-n-600);     --lg-ink-disabled:var(--lg-n-500);\n  --lg-ink-on-accent:var(--lg-n-0);\n\n  --lg-border:var(--lg-n-200);        --lg-border-strong:var(--lg-n-300);\n  --lg-border-quiet:var(--lg-n-100);  --lg-border-hover:var(--lg-n-600);\n  --lg-rule-accent:var(--lg-b-500);\n\n  --lg-accent:var(--lg-b-500);        --lg-accent-deep:var(--lg-b-600);\n  --lg-accent-press:var(--lg-b-700);\n\n  --lg-link:var(--lg-b-600);          --lg-link-hover:var(--lg-b-700);\n  --lg-link-visited:var(--lg-b-800);  --lg-focus:var(--lg-b-600);\n  --lg-selection-bg:var(--lg-b-100);  --lg-selection-ink:var(--lg-n-950);\n\n  --lg-critical:var(--lg-r-600);      --lg-critical-deep:var(--lg-r-700);\n  --lg-critical-tint:var(--lg-r-50);\n\n  /* amber — emphasis, one occurrence per view, ≤1% coverage (§3.7).\n     Not a status, not a warning, not the third step of a scale. */\n  --lg-amber:var(--lg-a-400);         --lg-amber-deep:var(--lg-a-500);\n  --lg-amber-press:var(--lg-a-600);   --lg-amber-ink:var(--lg-a-700);\n  --lg-amber-tint:var(--lg-a-50);     --lg-amber-tint-strong:var(--lg-a-100);\n  --lg-amber-border:var(--lg-a-300);  --lg-ink-on-amber:var(--lg-ink);\n  --lg-rule-emphasis:var(--lg-amber);\n\n  /* findings encoding — presence and absence, never hue (§4) */\n  --lg-held-ink:var(--lg-ink);            --lg-held-border:var(--lg-n-300);\n  --lg-unassigned-border:var(--lg-n-200); --lg-unassigned-fill:transparent;\n  --lg-absent-hatch:var(--lg-n-400);      --lg-absent-ink:var(--lg-n-600);\n  --lg-pointed-fill:var(--lg-b-50);       --lg-pointed-rule:var(--lg-b-500);\n\n  /* sequential (one hue, CVD-safe) and categorical series */\n  --lg-seq-1:var(--lg-b-200); --lg-seq-2:var(--lg-b-300); --lg-seq-3:var(--lg-b-400);\n  --lg-seq-4:var(--lg-b-500); --lg-seq-5:var(--lg-b-600); --lg-seq-6:var(--lg-b-800);\n  --lg-cat-1:var(--lg-b-600); --lg-cat-2:var(--lg-n-600);\n  --lg-cat-3:var(--lg-b-300); --lg-cat-4:var(--lg-n-400);\n  --lg-cat-5:var(--lg-amber);\n\n  /* focus — 2px ring + 2px background offset, one definition for every context.\n     box-shadow here is a RING, not depth. It is the only box-shadow in the system. */\n  --lg-focus-width:2px;              /* @kind spacing */\n  --lg-focus-offset:2px;             /* @kind spacing */\n  --lg-focus-ring:0 0 0 var(--lg-focus-offset) var(--lg-bg),\n                  0 0 0 calc(var(--lg-focus-offset) + var(--lg-focus-width)) var(--lg-focus);\n}\n\n/* ─────────────────── LAYER 3 — COMPONENT TOKENS ─────────────────── */\n:root{\n  /* button */\n  --lg-btn-pad-block:0.625rem;      --lg-btn-pad-inline:1.25rem;\n  --lg-btn-pad-block-sm:0.375rem;   --lg-btn-pad-inline-sm:0.75rem;\n  --lg-btn-radius:var(--lg-radius-1);\n  --lg-btn-border-width:var(--lg-hair); /* @kind spacing */\n  --lg-btn-font-size:var(--lg-text-base);\n  --lg-btn-weight:var(--lg-w-strong); /* @kind font */\n  --lg-btn-primary-bg:var(--lg-accent);\n  --lg-btn-primary-bg-hover:var(--lg-accent-deep);\n  --lg-btn-primary-bg-active:var(--lg-accent-press);\n  --lg-btn-primary-ink:var(--lg-ink-on-accent);\n  --lg-btn-secondary-bg:var(--lg-bg);\n  --lg-btn-secondary-bg-hover:var(--lg-surface);\n  --lg-btn-secondary-bg-active:var(--lg-surface-press);\n  --lg-btn-secondary-border:var(--lg-border-strong);\n  --lg-btn-secondary-ink:var(--lg-ink);\n  --lg-btn-quiet-ink:var(--lg-accent-deep);\n  --lg-btn-quiet-bg-hover:var(--lg-surface);\n  --lg-btn-disabled-bg:var(--lg-n-100);\n  --lg-btn-disabled-ink:var(--lg-ink-disabled);\n  --lg-btn-disabled-border:var(--lg-n-400);\n\n  /* field */\n  --lg-input-bg:var(--lg-bg);\n  --lg-input-border:var(--lg-border-strong);\n  --lg-input-border-hover:var(--lg-border-hover);\n  --lg-input-border-focus:var(--lg-accent-deep);\n  --lg-input-ink:var(--lg-ink);\n  --lg-input-placeholder:var(--lg-ink-disabled);\n  --lg-input-pad-block:0.5rem;\n  --lg-input-pad-inline:0.75rem;\n  --lg-input-radius:var(--lg-radius-1);\n  --lg-input-disabled-bg:var(--lg-surface-sunk);\n  --lg-input-disabled-border:var(--lg-n-400);\n  --lg-label-ink:var(--lg-ink);\n  --lg-hint-ink:var(--lg-ink-muted);\n  --lg-error-ink:var(--lg-critical);\n  --lg-control-size:1.125rem;        /* @kind spacing */        /* checkbox / radio box */\n\n  /* table */\n  --lg-table-border:var(--lg-border);\n  --lg-table-border-strong:var(--lg-border-strong);\n  --lg-table-head-ink:var(--lg-ink-muted);\n  --lg-table-head-bg:var(--lg-bg);\n  --lg-table-cell-pad-block:0.625rem;\n  --lg-table-cell-pad-inline:0.875rem;\n  --lg-table-row-hover:var(--lg-surface-sunk);\n  --lg-table-stripe:var(--lg-surface-sunk);\n  --lg-table-selected-fill:var(--lg-pointed-fill);\n  --lg-table-selected-rule:var(--lg-pointed-rule);\n\n  /* card / section / callout */\n  --lg-card-bg:var(--lg-bg);\n  --lg-card-border:var(--lg-border);\n  --lg-card-radius:var(--lg-radius-1);\n  --lg-card-pad:var(--lg-space-5);\n  --lg-section-border:var(--lg-border);\n  --lg-section-pad-block:var(--lg-space-7);\n  --lg-callout-bg:var(--lg-tint);\n  --lg-callout-rule:var(--lg-rule-accent);\n  --lg-callout-pad:var(--lg-space-5);\n\n  /* navigation */\n  --lg-header-border:var(--lg-border);\n  --lg-header-pad-block:var(--lg-space-4);\n  --lg-nav-ink:var(--lg-ink-secondary);\n  --lg-nav-ink-current:var(--lg-ink);\n  --lg-nav-current-rule:var(--lg-rule-accent);\n  --lg-breadcrumb-ink:var(--lg-ink-muted);\n  --lg-footer-bg:var(--lg-surface);\n  --lg-footer-border:var(--lg-border);\n  --lg-page-ink:var(--lg-ink-secondary);\n  --lg-page-current-bg:var(--lg-accent-deep);\n\n  /* emphasis — the amber vocabulary, and all of it */\n  --lg-highlight-bg:var(--lg-amber-tint-strong);\n  --lg-highlight-ink:var(--lg-ink-on-amber);\n  --lg-marker-size:0.5rem;           /* @kind spacing */\n  --lg-marker-fill:var(--lg-amber);\n  --lg-callout-rule-emphasis:var(--lg-rule-emphasis);\n  --lg-callout-bg-emphasis:var(--lg-amber-tint);\n  --lg-nav-marker:var(--lg-amber);\n  --lg-figure-number-ink:var(--lg-amber-ink);\n\n  /* lockup slot (§8) — Arabic wordmark box is taller than the Latin one */\n  --lg-lockup-ratio-ar:1.18;         /* @kind other */         /* +18% vertical room for ج descender */\n  --lg-lockup-mark-sm:16px;\n  --lg-lockup-mark-md:32px;\n  --lg-lockup-mark-lg:96px;\n  --lg-lockup-gap:var(--lg-space-2);\n  --lg-lockup-slot-border:var(--lg-border-strong);\n}\n\n/* ═══════════════════════════════════════════════════════════════════════════\n   Linkgurus — base: element defaults, bidi, focus, selection, tables, forms.\n   Logical properties only. A physical left/right in this file is a bug.\n   ═══════════════════════════════════════════════════════════════════════════ */\n\n*,*::before,*::after{box-sizing:border-box}\nhtml{font-size:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}\nbody,h1,h2,h3,h4,h5,h6,p,figure,blockquote,dl,dd,ol,ul,fieldset,legend{margin:0;padding:0}\nul[class],ol[class]{list-style:none}\nimg,svg,video{display:block;max-width:100%;height:auto}\nbutton,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}\nfieldset{border:0}\n\nbody{\n  background:var(--lg-bg);\n  color:var(--lg-ink);\n  font-family:var(--lg-font-latin);\n  font-size:var(--lg-text-base);\n  font-weight:var(--lg-w-body);\n  line-height:var(--lg-lh-latin);\n  text-wrap:pretty;\n  -webkit-font-smoothing:antialiased;\n  font-variant-numeric:lining-nums;\n  font-synthesis:none;\n}\n\n/* ── Direction ────────────────────────────────────────────────────────────\n   The Arabic optical uplift is applied ONCE, at a direction root: the <html>\n   element in RTL, or an explicit .lg-ar-root block inside an LTR page.\n   Applying it to every [lang=\"ar\"] node would compound 1.08 per nesting level. */\n:root[dir=\"rtl\"],\n:root[lang=\"ar\"],\n.lg-ar-root{\n  font-family:var(--lg-font-ar);\n  line-height:var(--lg-lh-ar);\n  font-size:calc(1em * var(--lg-ar-scale));\n  letter-spacing:0 !important;\n  font-synthesis:none;\n}\n/* body carries its own font-family/size, so the root binding above never reaches it\n   by inheritance — restate it for the one child that shadows it. */\n:root[dir=\"rtl\"]>body,:root[lang=\"ar\"]>body{\n  font-family:var(--lg-font-ar);\n  line-height:var(--lg-lh-ar);\n  font-size:calc(var(--lg-text-base) * var(--lg-ar-scale));\n  letter-spacing:0 !important;\n  font-synthesis:none;\n}\n/* Arabic run inside a Latin page (or vice versa): family + line-height, no uplift. */\n[lang=\"ar\"]:not(:root):not(.lg-ar-root),\n[dir=\"rtl\"]:not(:root):not(.lg-ar-root){\n  font-family:var(--lg-font-ar);\n  line-height:var(--lg-lh-ar);\n  letter-spacing:0 !important;\n  font-synthesis:none;\n}\n[lang=\"en\"]:not(:root),[dir=\"ltr\"]:not(:root){\n  font-family:var(--lg-font-latin);\n  line-height:var(--lg-lh-latin);\n}\n/* Bidi size normalisation — the uplift is applied exactly once per script run.\n   Arabic block inside a Latin root: add the uplift. Latin block inside an\n   Arabic root: remove it. Nested same-script blocks are reset so 1.08 can\n   never compound. */\n:root[dir=\"ltr\"] [lang=\"ar\"],:root[dir=\"ltr\"] [dir=\"rtl\"]{font-size:calc(1em * var(--lg-ar-scale))}\n:root[dir=\"ltr\"] [lang=\"ar\"] [lang=\"ar\"],:root[dir=\"ltr\"] [dir=\"rtl\"] [dir=\"rtl\"]{font-size:1em}\n:root[dir=\"rtl\"] [lang=\"en\"],:root[dir=\"rtl\"] [dir=\"ltr\"]{font-size:calc(1em / var(--lg-ar-scale))}\n:root[dir=\"rtl\"] [lang=\"en\"] [lang=\"en\"],:root[dir=\"rtl\"] [dir=\"ltr\"] [dir=\"ltr\"]{font-size:1em}\n.lg-latin-root{font-family:var(--lg-font-latin);line-height:var(--lg-lh-latin);letter-spacing:var(--lg-track-flat)}\n/* Western digits inside Arabic text — procurement convention. */\n[lang=\"ar\"],[dir=\"rtl\"]{font-variant-numeric:lining-nums}\n/* No case transforms anywhere: Arabic has no case. */\n[class],h1,h2,h3,h4,h5,h6,button,a,th,label{text-transform:none}\n\n/* ── Headings ─────────────────────────────────────────────────────────── */\nh1,h2,h3,h4,h5,h6{\n  font-weight:var(--lg-w-strong);\n  line-height:var(--lg-lh-tight);\n  color:var(--lg-ink);\n  text-wrap:balance;\n  margin-block-end:var(--lg-space-3);\n}\n:root[dir=\"rtl\"] h1,:root[dir=\"rtl\"] h2,:root[dir=\"rtl\"] h3,\n.lg-ar-root h1,.lg-ar-root h2,.lg-ar-root h3,\n[lang=\"ar\"] h1,[lang=\"ar\"] h2,[lang=\"ar\"] h3{line-height:var(--lg-lh-ar-display)}\nh1{font-size:var(--lg-text-3xl)}\nh2{font-size:var(--lg-text-2xl)}\nh3{font-size:var(--lg-text-xl)}\nh4{font-size:var(--lg-text-md)}\nh5,h6{font-size:var(--lg-text-base)}\n\np{margin-block-end:var(--lg-space-4);max-inline-size:var(--lg-measure-latin)}\n[lang=\"ar\"] p,:root[dir=\"rtl\"] p,.lg-ar-root p{max-inline-size:var(--lg-measure-ar)}\np:last-child{margin-block-end:0}\nstrong,b{font-weight:var(--lg-w-strong)}\n/* No italic, no slant: emphasis is weight, colour or a rule. */\nem,i,cite,var,dfn,address{font-style:normal;font-weight:var(--lg-w-strong)}\nsmall{font-size:var(--lg-text-sm)}\nsup,sub{font-size:0.7em;line-height:0}\n/* emphasis highlight — the amber tint, ink on top. Never on a tashkil-bearing line. */\nmark{background:var(--lg-highlight-bg);color:var(--lg-highlight-ink);padding-inline:0.15em;border-radius:var(--lg-radius-0)}\nhr{border:0;border-block-start:var(--lg-hair) solid var(--lg-border);margin-block:var(--lg-space-6)}\n\nul,ol{padding-inline-start:1.25em;margin-block-end:var(--lg-space-4);max-inline-size:var(--lg-measure-latin)}\nli{margin-block-end:var(--lg-space-2)}\nli::marker{color:var(--lg-ink-muted)}\ndl{margin-block-end:var(--lg-space-4)}\ndt{font-weight:var(--lg-w-strong)}\ndd{margin-inline-start:0;color:var(--lg-ink-secondary);margin-block-end:var(--lg-space-3)}\n\nblockquote{\n  margin-block:var(--lg-space-5);\n  padding-inline-start:var(--lg-space-4);\n  border-inline-start:var(--lg-rule) solid var(--lg-rule-accent);\n  color:var(- ate-columns:repeat(2,minmax(0,1fr));gap:var(--lg-space-6)}\n@media (max-width:60rem){.ds-pair{grid-template-columns:minmax(0,1fr)}}\n.ds-panel{min-inline-size:0;display:flex;flex-direction:column;gap:var(--lg-space-4)}\n.ds-tag{font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-weight:var(--lg-w-strong);border-block-end:var(--lg-hair) solid var(--lg-border);padding-block-end:var(--lg-space-2)}\n.ds-mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--lg-text-xs);color:var(--lg-ink-muted)}\n.ds-case{border:var(--lg-hair) solid var(--lg-border);padding:var(--lg-space-5);background:var(--lg-bg);display:flex;flex-direction:column;gap:var(--lg-space-4)}\n.ds-case__label{font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-variant-numeric:tabular-nums}\n.ds-logo{display:block;inline-size:auto;align-self:flex-start;max-inline-size:100%}\n.ds-clear{position:relative;padding:calc(var(--lg-space-5));outline:var(--lg-hair) dashed var(--lg-border-strong);outline-offset:0;display:inline-flex}\n.ds-swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:var(--lg-space-2)}\n.ds-swatch{border:var(--lg-hair) solid var(--lg-border);font-size:var(--lg-text-xs);color:var(--lg-ink-muted);display:flex;flex-direction:column}\n.ds-swatch__chip{block-size:3.25rem;border-block-end:var(--lg-hair) solid var(--lg-border)}\n.ds-swatch__meta{padding:var(--lg-space-2);display:flex;flex-direction:column;gap:2px}\n.ds-swatch__meta b{color:var(--lg-ink);font-weight:var(--lg-w-strong)}\n.ds-scale{display:flex;flex-direction:column;gap:var(--lg-space-3)}\n.ds-scale__row{display:flex;align-items:baseline;gap:var(--lg-space-4);border-block-end:var(--lg-hair) dashed var(--lg-border);padding-block-end:var(--lg-space-2)}\n.ds-key{flex:none;inline-size:8.5rem;font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-variant-numeric:tabular-nums}\n.ds-space__row{display:flex;align-items:center;gap:var(--lg-space-3);font-size:var(--lg-text-xs);color:var(--lg-ink-muted)}\n.ds-space__bar{background:var(--lg-accent);block-size:0.5rem}\n.ds-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 var(--lg-space-6)}\n@media (max-width:60rem){.ds-rules{grid-template-columns:minmax(0,1fr)}}\n.ds-rules ul{list-style:none;padding:0;margin:0}\n.ds-rules li{border-block-start:var(--lg-hair) solid var(--lg-border);padding-block:var(--lg-space-3);display:grid;grid-template-columns:2.75rem 1fr;gap:var(--lg-space-3);align-items:baseline}\n.ds-rules li b{font-weight:var(--lg-w-strong);font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-variant-numeric:tabular-nums}\n.ds-do{font-weight:var(--lg-w-strong);color:var(--lg-ink)}\n.ds-dont{color:var(--lg-ink-secondary)}\n.ds-results th,.ds-results td{font-size:var(--lg-text-sm)}\n.ds-pass{font-weight:var(--lg-w-strong);color:var(--lg-ink)}\n.ds-toc{display:flex;flex-wrap:wrap;gap:var(--lg-space-2) var(--lg-space-4);font-size:var(--lg-text-sm);margin-block-start:var(--lg-space-5)}\n/* Left rail. Physically left in both directions — the only fixed element on the page,\n   and a documentation affordance, not a pattern for shipped pages. */\n.ds-nav{position:fixed;top:0;bottom:0;left:0;width:17.5rem;box-sizing:border-box;background:var(--lg-bg);border-right:var(--lg-hair) solid var(--lg-border);display:flex;flex-direction:column;gap:var(--lg-space-5);padding:var(--lg-space-5) var(--lg-space-4);overflow-y:auto;z-index:20}\n.ds-nav__brand{display:block;border:0}\n.ds-nav__brand img{display:block;block-size:38px;inline-size:auto}\n.ds-nav__meta{font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-variant-numeric:tabular-nums;margin:0;max-inline-size:none}\n.ds-nav__list{display:flex;flex-direction:column}\n.ds-nav__list a{display:flex;align-items:baseline;justify-content:space-between;gap:var(--lg-space-3);padding-block:var(--lg-space-2);font-size:var(--lg-text-sm);color:var(--lg-nav-ink);text-decoration:none;border-block-start:var(--lg-hair) solid var(--lg-border-quiet);transition:var(--lg-transition-ui)}\n.ds-nav__list a:hover{color:var(--lg-ink)}\n.ds-nav__list a[aria-current=\"true\"]{color:var(--lg-nav-ink-current);font-weight:var(--lg-w-strong)}\n.ds-nav__label{display:flex;align-items:center;gap:var(--lg-space-2)}\n.ds-nav__label .lg-marker{visibility:hidden}\n.ds-nav__list a[aria-current=\"true\"] .lg-marker{visibility:visible}\n.ds-nav__no{font-size:var(--lg-text-xs);color:var(--lg-ink-muted);font-variant-numeric:tabular-nums;flex:none}\n.ds-nav__foot{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:var(--lg-space-3);padding-block-start:var(--lg-space-4);border-block-start:var(--lg-hair) solid var(--lg-border)}\n.ds-nav__foot .ds-mono{max-inline-size:none}\n.ds-shell{margin-left:17.5rem}\n@media (max-width:56rem){\n  .ds-nav{position:static;width:auto;border-right:0;border-bottom:var(--lg-hair) solid var(--lg-border)}\n  .ds-nav__list{display:grid;grid-template-columns:repeat(auto-fit,minmax(10rem,1fr));gap:0 var(--lg-space-5)}\n  .ds-shell{margin-left:0}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<aside class=\"ds-nav\">\n  <a class=\"ds-nav__brand\" href=\"#top\" aria-label=\"لينك جوروز — أعلى الصفحة\"><img src=\"593c047d-7566-4403-ba11-ed5d3f8e63e2\" alt=\"لينك جوروز\"><\u002Fa>\n  <p class=\"ds-nav__meta\" dir=\"ltr\" lang=\"en\">Design system · v1.1 · Aug 2026<\u002Fp>\n  <nav class=\"ds-nav__list\" aria-label=\"أقسام النظام\">\n    <a href=\"#brand\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>الهوية والشعار<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">01<\u002Fspan><\u002Fa>\n    <a href=\"#colour\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>اللون<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">02<\u002Fspan><\u002Fa>\n    <a href=\"#amber\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>الكهرمان<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">03<\u002Fspan><\u002Fa>\n    <a href=\"#type\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>الطباعة<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">04<\u002Fspan><\u002Fa>\n    <a href=\"#space\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>المسافة والحركة<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">05<\u002Fspan><\u002Fa>\n    <a href=\"#components\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>المكوّنات<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">06<\u002Fspan><\u002Fa>\n    <a href=\"#findings\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>ترميز النتائج<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">07<\u002Fspan><\u002Fa>\n    <a href=\"#rules\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>القواعد<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">08<\u002Fspan><\u002Fa>\n    <a href=\"#tests\"><span class=\"ds-nav__label\"><span class=\"lg-marker\" aria-hidden=\"true\"><\u002Fspan>اختبارات القبول<\u002Fspan><span class=\"ds-nav__no\" dir=\"ltr\">09<\u002Fspan><\u002Fa>\n  <\u002Fnav>\n  <div class=\"ds-nav__foot\">\n    <div class=\"lg-lang\" role=\"group\" aria-label=\"اتجاه الصفحة\">\n      <button type=\"button\" id=\"dir-rtl\" aria-pressed=\"true\">عربي RTL<\u002Fbutton>\n      <button type=\"button\" id=\"dir-ltr\" aria-pressed=\"false\">EN LTR<\u002Fbutton>\n    <\u002Fdiv>\n    <p class=\"ds-mono\" dir=\"ltr\" lang=\"en\">styles.css · self-hosted fonts · 0 external requests<\u002Fp>\n  <\u002Fdiv>\n<\u002Faside>\n\n<div class=\"ds-shell\">\n<main class=\"lg-container\" id=\"top\">\n\n<section class=\"ds-head\">\n  <p class=\"lg-eyebrow\">نظام التصميم · الإصدار 1.1 · أغسطس 2026<\u002Fp>\n  <h1>نظام واحد، لغتان، واتجاهان يعملان بالتساوي<\u002Fh1>\n  <p style=\"max-inline-size:var(--lg-measure-ar);color:var(--lg-ink-secondary)\">هذه الصفحة هي النظام كاملًا: الهوية والشعار، اللون، الطباعة، المسافة، المكوّنات، وترميز نتائج التشخيص. العربية هي اللغة الأولى، والإنجليزية توأمها لا ترجمتها. زر «EN LTR» في الشريط الجانبي يقلب اتجاه الصفحة بالكامل — وهو اختبار قبول، لا زينة: ما ينكسر عند القلب خطأ في النظام.<\u002Fp>\n  <p class=\"ds-mono\" dir=\"ltr\" lang=\"en\">styles.css → tokens/{fonts,colors,spacing,motion}.css · base.css · components.css — self-hosted fonts, zero external requests, logical properties only<\u002Fp>\n<\u002Fsection>\n\n<!-- 1 · BRAND -->\n<section class=\"ds-sec\" id=\"brand\">\n  <p class=\"ds-sec__no\">01<\u002Fp>\n  <h2 class=\"ds-sec__title\">الهوية والشعار<\u002Fh2>\n  <p class=\"ds-sec__note\">الشعار كتلة واحدة: علامة على شكل موصّل مفتوح، ووسم نصي ثقيل بسطرين. النسختان مسلَّمتان نهائيتين ولا شيء فيهما مرسوم من جديد: اللاتينية بالعلامة على اليسار، والعربية بمسارات محوَّلة عن الخط — لا نص حي — والعلامة مقلوبة إلى يمين الكتلة، بارتفاع 446 وحدة مقابل 440 للوسم، فالكتلتان متكافئتان بصريًا. الأيقونة تُسلَّم أيضًا وحدها، وهي عين العلامة في <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">assets/mark.svg<\u002Fspan>.<\u002Fp>\n\n  <h3 class=\"ds-sub\">النسختان المعتمدتان<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-case\">\n      <p class=\"ds-case__label\" dir=\"ltr\" lang=\"en\">assets/logo.svg — Latin, 3551.3 × 1278<\u002Fp>\n      <img class=\"ds-logo\" src=\"75e7f694-effa-4713-94a7-ffad8d6d4aeb\" alt=\"Linkgurus\" style=\"block-size:104px\">\n      <p class=\"lg-figure__caption\">العلامة على اليسار، وفتحتها موجّهة إلى النص. تُستخدم في كل سياق لاتيني: العقود الإنجليزية، الشرائح الدولية، التواقيع.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-case\">\n      <p class=\"ds-case__label\" dir=\"ltr\" lang=\"en\">assets/logo-ar.svg — Arabic, outlined, 1133.1 × 446.1<\u002Fp>\n      <img class=\"ds-logo\" src=\"ad5f5981-465e-4d04-aded-7cc4f6e28152\" alt=\"لينك جوروز\" style=\"block-size:104px\">\n      <p class=\"lg-figure__caption\">العلامة مقلوبة إلى اليمين، وفتحتها موجّهة إلى النص العربي: «لينك» فوق «جوروز». الوسم العربي مسارات لا نصًّا حيًّا، فالملف لا يعتمد على خط ولا يتغيّر عند الطبع.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">العلامة وحدها، والقلب<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\" dir=\"ltr\" lang=\"en\">assets/mark.svg · assets/mark-rtl.svg — 1508.1 × 1266.7<\u002Fp>\n      <div class=\"lg-row\" style=\"gap:var(--lg-space-6)\">\n        <span class=\"ds-case\" style=\"padding:var(--lg-space-4)\"><img class=\"ds-logo\" src=\"c52f3b6c-e12c-4eaf-9fcd-8a483ca22cf6\" alt=\"\" style=\"block-size:76px\"><span class=\"ds-case__label\" dir=\"ltr\" lang=\"en\">mark.svg — LTR<\u002Fspan><\u002Fspan>\n        <span class=\"ds-case\" style=\"padding:var(--lg-space-4)\"><img class=\"ds-logo\" src=\"141e667c-30d0-4f64-88bc-dbf99ae2df94\" alt=\"\" style=\"block-size:76px\"><span class=\"ds-case__label\" dir=\"ltr\" lang=\"en\">mark-rtl.svg — RTL<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n      <p>العلامة وحدها مسموحة في الأيقونات والتذييل ورأس المستند حيث يظهر الاسم نصًا مجاورًا. في صفحة عربية تُستخدم النسخة المقلوبة دائمًا؛ الفتحة تشير إلى النص، لا إلى حافة الشاشة.<\u002Fp>\n      <p class=\"lg-figure__caption\">النقطة الكهرمانية <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">#FBB400<\u002Fspan> هي مصدر لون التوكيد في النظام (القسم 03). موحّدة على هذه القيمة في كل ملفات العلامة، ولا يُشتق منها لون حالة.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"ds-panel\">\n      <p class=\"ds-tag\">الفراغ المحيط والحد الأدنى للمقاس<\u002Fp>\n      <div class=\"ds-case\">\n        <span class=\"ds-clear\"><img class=\"ds-logo\" src=\"ad5f5981-465e-4d04-aded-7cc4f6e28152\" alt=\"لينك جوروز\" style=\"block-size:64px\"><\u002Fspan>\n        <p class=\"ds-case__label\">الفراغ المحيط = نصف ارتفاع الكتلة على الجهات الأربع. لا يدخله نص ولا مسطرة ولا حافة صورة.<\u002Fp>\n      <\u002Fdiv>\n      <table class=\"lg-table\">\n        <thead><tr><th scope=\"col\">الاستخدام<\u002Fth><th scope=\"col\">الحد الأدنى<\u002Fth><\u002Ftr><\u002Fthead>\n        <tbody>\n          <tr><th scope=\"row\">الكتلة الكاملة (عربي أو لاتيني)<\u002Fth><td class=\"lg-table__num\">28px ارتفاعًا<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">العلامة وحدها<\u002Fth><td class=\"lg-table__num\">20px ارتفاعًا<\u002Ftd><\u002Ftr>\n          <tr><th scope=\"row\">الطبع<\u002Fth><td class=\"lg-table__num\">8mm ارتفاعًا<\u002Ftd><\u002Ftr>\n        <\u002Ftbody>\n      <\u002Ftable>\n      <p class=\"lg-figure__caption\">تحت هذه الحدود تنطبق أطراف الموصّل وتضيع النقطة. استخدم العلامة وحدها بدل تصغير الكتلة.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <h3 class=\"ds-sub\">الكتلة النصية الثلاثية<\u002Fh3>\n  <div class=\"ds-pair\">\n    <div class=\"ds-case\">\n      <p class=\"ds-case__label\">96px — لوحة كاملة، ثلاثة أسطر<\u002Fp>\n      <div class=\"lg-lockup lg-lockup--lg\">\n        <img class=\"lg-lockup__mark\" src=\"141e667c-30d0-4f64-88bc-dbf99ae2df94\" alt=\"\">\n        <div class=\"lg-lockup__lines\">\n          <span class=\"lg-lockup__wordmark\">لينك جوروز<\u002Fspan>\n          <span class=\"lg-lockup__corporate lg-tashkil\">«مَن يقرر… وماذا يبقى»<\u002Fspan>\n          <span class=\"lg-lockup__categories\">المختبر · البنية والتصميم المؤسسي · نموذج التشغيل الذكي<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ds-case\">\n      <p class=\"ds-case__label\">32px و16px — الحد الأدنى<\u002Fp>\n      <div class=\"lg-lockup lg-lockup--md\">\n        <img class=\"lg-lockup__mark\" src=\"141e667c-30d0-4f64-88bc-dbf99ae2df94\" alt=\"\">\n        <div class=\"lg-lockup__lines\">\n          <span class=\"lg-lockup__wordmark\">لينك جوروز<\u002Fspan>\n          <span class=\"lg-lockup__corporate lg-tashkil\">«مَن يقرر… وماذا يبقى»<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"lg-lockup lg-lockup--sm\">\n        <img class=\"lg-lockup__mark\" src=\"141e667c-30d0-4f64-88bc-dbf99ae2df94\" alt=\"\">\n        <div class=\"lg-lockup__lines\">\n          <span class=\"lg-lockup__wordmark\">لينك جوروز<\u002Fspan>\n          <span class=\"lg-lockup__corporate lg-tashkil\">«مَن يقرر… وماذا يبقى»<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"lg-figure__caption\">التشكيل مثبَّت في كل المقاسات: الفتحة على «مَن»، والتنوين على «قرارٌ» — حبر على أبيض، بلا تخفيف. السطر المؤسسي يصحب الوسم فوق الطية دائمًا.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 2 · COLOUR -->\n<section class=\"ds-sec\" id=\"colour\">\n  <p class=\"ds-sec__no\">02<\u002Fp>\n  <h2 class=\"ds-sec__title\">اللون — أزرق واحد، وكهرمان واحد، وأرضية بيضاء<\u002Fh2>\n  <p class=\"ds-sec__note\">درجتان فقط: الأزرق هو لون النظام، والكهرمان <span dir=\"ltr\" lang=\"en\" class=\"ds-mono\">#FBB400<\u002Fspan> هو لون التوكيد وقُطره محدود في القسم 03. لا لون ثالث، ولا تدرّج، ولا ظل. الأزرق للعلامات والمساطر والتعبئة والعناوين من 24px وأعلى؛ الأزرق الغائر وحده مسموح على المتن والروابط. تغطية الأزرق تبقى قرابة 10% من أي مساحة عرض، والكهرمان تحت 1%، والقياسات كلها على أبيض.<\u002Fp>\n  <div class=\"ds-swatches\">\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-n-0)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>n-0<\u002Fb><span dir=\"ltr\" lang=\"en\">#FFFFFF · bg<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-n-25)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>n-25<\u002Fb><span dir=\"ltr\" lang=\"en\">#FAFAFB · sunk<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-n-50)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>n-50<\u002Fb><span dir=\"ltr\" lang=\"en\">#F4F5F6 · surface<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <div class=\"ds-swatch\"><div class=\"ds-swatch__chip\" style=\"background:var(--lg-n-100)\"><\u002Fdiv><div class=\"ds-swatch__meta\"><b>n-100<\u002Fb><span dir=\"ltr
